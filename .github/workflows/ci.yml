name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Edge Functions
        working-directory: supabase/functions
        run: deno check --node-modules-dir=none */index.ts
      - name: Lint app
        run: npm run lint
        working-directory: app
      - name: Build web app
        run: npx expo export --platform web
        working-directory: app
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to a fresh database
        run: npx supabase db start
      - name: Lint schema
        run: npx supabase db lint --fail-on error

  integration:
    # Full draft against a local Supabase (auth, RLS, Edge Functions, live MLB API).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start -x imgproxy,vector,logflare,studio,storage-api,mailpit
      - name: Serve Edge Functions
        run: |
          npx supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do grep -q "Serving functions" functions.log && break; sleep 2; done
      - run: npm run test:int
      - if: failure()
        run: cat functions.log
