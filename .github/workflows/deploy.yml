name: Deploy

# main       → staging, then opens/updates the "Release to production" PR (main → production)
# production → production. Only the repo owner can update the production branch, so merging
#              the release PR (works from the GitHub mobile app) is the approval.
on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        id: vercel
        with:
          target: staging
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase-project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase-db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase-publishable-key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          vercel-alias: ${{ vars.VERCEL_STAGING_ALIAS }}

  release-pr:
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changes=$(git log --no-merges --format='- %s' origin/production..origin/main)
          if [ -z "$changes" ]; then
            echo "Production is up to date."
            exit 0
          fi
          body=$(printf '%s\n' \
            "Merging this deploys everything below to **production** (https://baggery.vercel.app)." \
            "It's already live on staging: https://baggery-staging.vercel.app" \
            "" \
            "Use **Create a merge commit** (the only option allowed here)." \
            "" \
            "## Changes" \
            "$changes")
          number=$(gh pr list --base production --head main --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body"
          else
            gh pr create --base production --head main --title "Release to production" --body "$body"
          fi

  production:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        id: vercel
        with:
          target: production
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase-project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase-db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase-publishable-key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
